<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{SUBTITLE}}" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #eef3f7;
      --paper: #ffffff;
      --text: #263b50;
      --text-strong: #152a43;
      --muted: #607489;
      --border: #d6e0e8;
      --border-strong: #bbccd9;
      --accent: #2457a6;
      --accent-warm: #f26b4a;
      --accent-sun: #f4b740;
      --surface-cool: #f5f9fc;
      --surface-warm: #fff9f2;
      --focus: #c24124;
      --ok: #046b4d;
      --warn: #745012;
      --risk: #a92b25;
      --inference: #655099;
      --brand-mark: rgba(36, 87, 166, 0.018);
      --radius: 10px;
      --radius-sm: 7px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--canvas); }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.76;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible, [tabindex="0"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      top: -60px;
      left: 16px;
      z-index: 99;
      padding: 10px 14px;
      color: #ffffff;
      background: var(--text-strong);
    }
    .skip-link:focus { top: 16px; }
    .report-shell {
      position: relative;
      isolation: isolate;
      width: min(1380px, calc(100% - 48px));
      min-height: 100dvh;
      margin: 24px auto;
      padding: 32px 56px 88px;
      display: grid;
      grid-template-columns: minmax(210px, 250px) minmax(0, 860px);
      column-gap: 72px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(35, 61, 84, 0.08);
    }
    .report-shell::before {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 0;
      content: attr(data-brand);
      color: var(--brand-mark);
      font-size: clamp(4.5rem, 14vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      white-space: nowrap;
      text-transform: lowercase;
      transform: translate(-46%, -50%) rotate(-24deg);
      transform-origin: center;
      pointer-events: none;
      user-select: none;
    }
    .report-shell > * { position: relative; z-index: 1; }
    .report-header {
      position: relative;
      grid-column: 1 / -1;
      margin-bottom: 42px;
      padding: 46px 52px 40px;
      overflow: hidden;
      background: linear-gradient(120deg, #edf6ff 0%, #fffdf9 66%, #fff4e8 100%);
      border: 1px solid #c9ddeb;
      border-left: 5px solid var(--accent-warm);
      border-radius: 9px;
    }
    .report-header::after {
      position: absolute;
      top: -96px;
      right: -72px;
      width: 190px;
      height: 190px;
      content: "";
      background: radial-gradient(circle, rgba(244, 183, 64, 0.28), rgba(244, 183, 64, 0) 68%);
      pointer-events: none;
    }
    .report-header > * { position: relative; z-index: 1; }
    .document-type {
      margin: 0 0 10px;
      color: #c24124;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .report-header h1 {
      margin: 0 0 14px;
      color: var(--text-strong);
      font-size: clamp(2.15rem, 4vw, 3.35rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
      overflow-wrap: anywhere;
    }
    .subtitle { max-width: 820px; margin: 0 0 24px; color: #405f77; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0;
      padding-top: 15px;
      color: #506b82;
      border-top: 1px solid rgba(242, 107, 74, 0.24);
      font-size: 13px;
    }
    .decision-grid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: -18px 0 48px;
    }
    .decision-item {
      min-height: 108px;
      padding: 17px 18px;
      background: #fbfdff;
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 8px;
    }
    .decision-item.decision-primary {
      background: var(--surface-warm);
      border-top-color: var(--accent-warm);
    }
    .decision-item.decision-opportunity { border-top-color: var(--accent-sun); }
    .decision-item strong { display: block; margin-bottom: 6px; color: var(--text-strong); }
    .decision-item span { display: block; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .report-toc {
      grid-column: 1;
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      overflow: auto;
      font-size: 13px;
    }
    .report-toc::before {
      display: block;
      margin-bottom: 12px;
      padding-bottom: 9px;
      color: var(--text-strong);
      border-bottom: 2px solid var(--accent-warm);
      content: "报告目录";
      font-size: 15px;
      font-weight: 700;
    }
    .report-toc ol, .report-toc ul { margin: 0; padding: 0; list-style: none; }
    .report-toc ol ol, .report-toc ul ul { margin: 4px 0 8px; padding-left: 14px; }
    .report-toc a {
      display: block;
      padding: 5px 4px;
      color: #4c6479;
      text-decoration: none;
      border-radius: 4px;
    }
    .report-toc a:hover { color: var(--accent); background: var(--surface-warm); }
    .report-content { grid-column: 2; min-width: 0; }
    .report-content h2, .report-content h3, .report-content h4 {
      scroll-margin-top: 24px;
      line-height: 1.38;
    }
    .report-content h2 {
      margin: 66px 0 22px;
      padding: 0 0 13px 12px;
      color: var(--text-strong);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--accent-warm);
      font-size: 1.56rem;
      letter-spacing: -0.018em;
    }
    .report-content > h2:first-child { margin-top: 0; }
    .report-content h3 { margin: 35px 0 12px; color: #245481; font-size: 1.15rem; }
    .report-content h4 { color: #315e8d; }
    .report-content p, .report-content li { max-width: 79ch; }
    .report-content strong { color: var(--text-strong); }
    .report-content blockquote, .callout {
      margin: 24px 0;
      padding: 16px 20px;
      background: var(--surface-warm);
      border-left: 3px solid var(--accent-warm);
    }
    .callout.success { background: #ecfdf5; border-left-color: var(--ok); }
    .callout.warning { background: #fff8e6; border-left-color: var(--warn); }
    .callout.risk { background: #fff2f0; border-left-color: var(--risk); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre {
      padding: 17px 19px;
      overflow: auto;
      color: #29445f;
      background: #f4f7fa;
      border: 1px solid var(--border);
      border-left: 3px solid #8fb7e1;
      border-radius: var(--radius-sm);
      font-size: 13px;
      line-height: 1.65;
    }
    :not(pre) > code { padding: 2px 5px; color: #244f80; background: #edf3f8; border-radius: 3px; }
    .table-wrap {
      width: 100%;
      margin: 20px 0 28px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; line-height: 1.55; }
    th, td { padding: 11px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th {
      color: #244f80;
      background: #eaf3fb;
      border-top: 2px solid var(--accent-warm);
      text-align: left;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) { background: #fbfdff; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.55;
      white-space: nowrap;
    }
    .badge-confirmed { color: var(--ok); background: #ecfdf5; }
    .badge-inference { color: var(--inference); background: #f6f2ff; }
    .badge-unverified { color: var(--risk); background: #fff2f0; }
    .badge-pending { color: var(--warn); background: #fff8e6; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media (max-width: 1120px) {
      .report-shell { display: block; width: calc(100% - 32px); padding: 28px 34px 64px; }
      .decision-grid { grid-template-columns: repeat(2, 1fr); margin-top: -12px; }
      .report-toc {
        position: static;
        max-height: none;
        margin-bottom: 42px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
      }
    }
    @media (max-width: 680px) {
      .report-shell { width: 100%; margin: 0; padding: 0 20px 48px; border: 0; border-radius: 0; }
      .report-header { margin: 0 -20px 32px; padding: 34px 24px 28px; border-radius: 0; }
      .report-header h1 { font-size: 2rem; }
      .decision-grid { grid-template-columns: 1fr; margin: 0 0 36px; }
      .decision-item { min-height: 0; }
      .report-content h2 { margin-top: 52px; font-size: 1.4rem; }
      .table-wrap { width: calc(100vw - 40px); }
    }
    @page { size: A4; margin: 16mm 14mm; }
    @media print {
      html, body { background: #ffffff !important; font-size: 10.2pt; }
      :root { --brand-mark: rgba(38, 59, 80, 0.022); }
      .skip-link, .document-type { display: none !important; }
      .report-shell { display: block; width: auto; min-height: 0; margin: 0; padding: 0; border: 0; box-shadow: none; }
      .report-header {
        margin: 0 0 12mm;
        padding: 0 0 7mm;
        background: #ffffff;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      .report-header::after { display: none; }
      .decision-grid { grid-template-columns: repeat(2, 1fr); margin: 0 0 12mm; }
      .report-toc { position: static; max-height: none; break-after: page; }
      .report-content h2 { margin-top: 12mm; }
      h2, h3, h4, tr, pre, blockquote, .callout, .decision-item { break-inside: avoid; }
      thead { display: table-header-group; }
      .table-wrap { overflow: visible; }
      table { font-size: 8pt; }
      th, td { padding: 5px 6px; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body data-layout="decision-brief" data-theme="executive-sunrise">
  <a class="skip-link" href="#report-content">跳到正文</a>
  <main class="report-shell" data-brand="brawnen">
    <header class="report-header">
      <p class="document-type">{{DOCUMENT_TYPE}}</p>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <p class="meta-row"><span>更新时间：{{UPDATED_AT}}</span>{{METADATA}}</p>
    </header>
    <section class="decision-grid" aria-label="核心决策摘要">
      {{DECISION_SUMMARY}}
    </section>
    <nav class="report-toc" aria-label="文档目录">
      {{TOC}}
    </nav>
    <article class="report-content" id="report-content">
      {{CONTENT}}
    </article>
  </main>
</body>
</html>
