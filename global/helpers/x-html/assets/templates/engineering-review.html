<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="{{SUBTITLE}}" />
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #edf2f7;
      --paper: #ffffff;
      --text: #24374b;
      --text-strong: #0f2942;
      --muted: #5b7085;
      --border: #d4dfe9;
      --border-strong: #b6c8d9;
      --accent: #0f6cbd;
      --accent-teal: #0d7490;
      --surface-cool: #f4f8fc;
      --surface-code: #f3f6fa;
      --focus: #0a4f8f;
      --ok: #046b4d;
      --warn: #8a5308;
      --risk: #a92b25;
      --inference: #5b4699;
      --brand-mark: rgba(15, 108, 189, 0.018);
      --radius: 10px;
      --radius-sm: 6px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--canvas); }
    body {
      margin: 0;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.74;
      font-variant-numeric: tabular-nums;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:focus-visible, summary:focus-visible, [tabindex="0"]:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      top: -60px;
      left: 16px;
      z-index: 99;
      padding: 10px 14px;
      color: #ffffff;
      background: var(--text-strong);
    }
    .skip-link:focus { top: 16px; }
    .spec-shell {
      position: relative;
      isolation: isolate;
      width: min(1380px, calc(100% - 48px));
      min-height: 100dvh;
      margin: 24px auto;
      padding: 32px 56px 88px;
      display: grid;
      grid-template-columns: minmax(210px, 248px) minmax(0, 860px);
      column-gap: 72px;
      align-items: start;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 14px 42px rgba(24, 48, 72, 0.07);
    }
    .spec-shell::before {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 0;
      content: attr(data-brand);
      color: var(--brand-mark);
      font-size: clamp(4.5rem, 14vw, 10rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.16em;
      white-space: nowrap;
      text-transform: lowercase;
      transform: translate(-46%, -50%) rotate(-24deg);
      transform-origin: center;
      pointer-events: none;
      user-select: none;
    }
    .spec-shell > * { position: relative; z-index: 1; }
    .spec-header {
      position: relative;
      grid-column: 1 / -1;
      margin-bottom: 36px;
      padding: 44px 50px 38px;
      overflow: hidden;
      background: linear-gradient(118deg, #ebf4ff 0%, #f8fbfe 62%, #e8f5f6 100%);
      border: 1px solid #c6daec;
      border-left: 5px solid var(--accent);
      border-radius: 9px;
    }
    .spec-header::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image: linear-gradient(to right, rgba(15, 108, 189, 0.04) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(15, 108, 189, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(90deg, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 55%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
    }
    .spec-header > * { position: relative; z-index: 1; }
    .document-type {
      margin: 0 0 10px;
      color: var(--accent-teal);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .spec-header h1 {
      margin: 0 0 14px;
      color: var(--text-strong);
      font-size: clamp(2rem, 3.8vw, 3.1rem);
      line-height: 1.16;
      letter-spacing: -0.035em;
      overflow-wrap: anywhere;
    }
    .subtitle { max-width: 820px; margin: 0 0 22px; color: #3d5a73; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      margin: 0;
      padding-top: 14px;
      color: #4b6780;
      border-top: 1px solid rgba(15, 108, 189, 0.2);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
    }
    .summary-strip {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: -14px 0 46px;
    }
    .summary-item {
      padding: 15px 17px;
      background: var(--surface-cool);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm);
    }
    .summary-item.summary-primary { background: #eef6ff; border-left-color: var(--accent-teal); }
    .summary-item.summary-ok { background: #ecfdf5; border-left-color: var(--ok); }
    .summary-item.summary-blocker { background: #fff2f0; border-left-color: var(--risk); }
    .summary-item strong {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .summary-item span {
      display: block;
      color: var(--text-strong);
      font-size: 14px;
      font-weight: 600;
      line-height: 1.48;
    }
    .spec-toc {
      grid-column: 1;
      position: sticky;
      top: 24px;
      max-height: calc(100vh - 48px);
      overflow: auto;
      font-size: 13px;
    }
    .spec-toc::before {
      display: block;
      margin-bottom: 12px;
      padding-bottom: 9px;
      color: var(--text-strong);
      border-bottom: 2px solid var(--accent);
      content: "章节导航";
      font-size: 14px;
      font-weight: 700;
    }
    .spec-toc ol, .spec-toc ul { margin: 0; padding: 0; list-style: none; }
    .spec-toc ol ol, .spec-toc ul ul { margin: 4px 0 8px; padding-left: 14px; }
    .spec-toc a {
      display: block;
      padding: 5px 6px;
      color: #486178;
      text-decoration: none;
      border-radius: 4px;
    }
    .spec-toc a:hover { color: var(--accent); background: var(--surface-cool); }
    .spec-content { grid-column: 2; min-width: 0; }
    .spec-content h2, .spec-content h3, .spec-content h4 {
      scroll-margin-top: 24px;
      line-height: 1.36;
    }
    .spec-content h2 {
      margin: 60px 0 20px;
      padding: 0 0 12px 12px;
      color: var(--text-strong);
      border-bottom: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      font-size: 1.5rem;
      letter-spacing: -0.015em;
    }
    .spec-content > h2:first-child { margin-top: 0; }
    .spec-content h3 { margin: 32px 0 11px; color: #194875; font-size: 1.14rem; }
    .spec-content h4 { margin: 22px 0 8px; color: #2a5885; }
    .spec-content p, .spec-content li { max-width: 79ch; }
    .spec-content strong { color: var(--text-strong); }
    .spec-content blockquote, .callout {
      margin: 22px 0;
      padding: 15px 19px;
      background: var(--surface-cool);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
    }
    .callout.success { background: #ecfdf5; border-left-color: var(--ok); }
    .callout.warning { background: #fff8e6; border-left-color: var(--warn); }
    .callout.risk { background: #fff2f0; border-left-color: var(--risk); }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    pre {
      padding: 16px 18px;
      overflow: auto;
      color: #1f3952;
      background: var(--surface-code);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-teal);
      border-radius: var(--radius-sm);
      font-size: 12.8px;
      line-height: 1.62;
    }
    :not(pre) > code { padding: 2px 5px; color: #164878; background: #eaf1f8; border-radius: 3px; font-size: 0.9em; }
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 22px 0 28px;
    }
    .compare-card {
      padding: 16px 18px;
      background: #fbfdff;
      border: 1px solid var(--border);
      border-top: 3px solid var(--border-strong);
      border-radius: var(--radius-sm);
    }
    .compare-card.compare-before { background: #fffafa; border-top-color: var(--risk); }
    .compare-card.compare-after { background: #f4fbf8; border-top-color: var(--ok); }
    .compare-card h4 { margin-top: 0; }
    .flow-figure {
      margin: 24px 0 30px;
      padding: 18px 20px;
      background: var(--surface-cool);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .flow-figure figcaption {
      margin-bottom: 14px;
      color: var(--text-strong);
      font-size: 13.5px;
      font-weight: 700;
    }
    .process-flow {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px 26px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: step;
    }
    .process-step {
      position: relative;
      padding: 13px 14px;
      background: var(--paper);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      counter-increment: step;
    }
    .process-step::before {
      content: "0" counter(step);
      display: inline-block;
      margin-bottom: 4px;
      color: var(--accent-teal);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .process-step:not(:last-child)::after {
      position: absolute;
      top: 50%;
      right: -19px;
      transform: translateY(-50%);
      color: var(--accent);
      content: "→";
      font-weight: 700;
    }
    .process-step strong { display: block; margin-bottom: 4px; font-size: 13.5px; }
    .process-step span { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
    details.evidence-fold {
      margin: 18px 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fafcfe;
    }
    details.evidence-fold > summary {
      padding: 10px 14px;
      cursor: pointer;
      color: var(--text-strong);
      font-size: 13.5px;
      font-weight: 600;
    }
    details.evidence-fold > div, details.evidence-fold > pre { margin: 0; border-top: 1px solid var(--border); border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; }
    .table-wrap {
      width: 100%;
      margin: 20px 0 28px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; line-height: 1.55; }
    th, td { padding: 10px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th {
      color: #194875;
      background: #ebf3fb;
      border-top: 2px solid var(--accent);
      text-align: left;
      white-space: nowrap;
    }
    tbody tr:nth-child(even) { background: #fbfdff; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.55;
      white-space: nowrap;
    }
    .badge-confirmed { color: var(--ok); background: #ecfdf5; }
    .badge-user { color: var(--accent); background: #eef6ff; }
    .badge-inference { color: var(--inference); background: #f6f2ff; }
    .badge-unverified { color: var(--risk); background: #fff2f0; }
    .badge-pending { color: var(--warn); background: #fff8e6; }
    .priority-blocker, .priority-strong { color: var(--risk); background: #fff2f0; }
    .priority-important, .priority-worth { color: var(--warn); background: #fff8e6; }
    .priority-optional, .priority-speculative { color: var(--muted); background: #f1f5f9; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    @media (max-width: 1120px) {
      .spec-shell { display: block; width: calc(100% - 32px); padding: 28px 34px 64px; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); margin-top: -10px; }
      .spec-toc {
        position: static;
        max-height: none;
        margin-bottom: 40px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--border);
      }
    }
    @media (max-width: 680px) {
      .spec-shell { width: 100%; margin: 0; padding: 0 20px 48px; border: 0; border-radius: 0; }
      .spec-header { margin: 0 -20px 30px; padding: 34px 24px 28px; border-radius: 0; }
      .spec-header h1 { font-size: 1.95rem; }
      .summary-strip, .compare-grid, .process-flow { grid-template-columns: 1fr; }
      .process-step:not(:last-child)::after {
        top: auto;
        right: auto;
        bottom: -16px;
        left: 18px;
        transform: none;
        content: "↓";
      }
      .spec-content h2 { margin-top: 48px; font-size: 1.36rem; }
      .table-wrap { width: calc(100vw - 40px); }
    }
    @page { size: A4; margin: 16mm 14mm; }
    @media print {
      html, body { background: #ffffff !important; font-size: 10pt; }
      :root { --brand-mark: rgba(15, 41, 66, 0.022); }
      .skip-link, .document-type { display: none !important; }
      .spec-shell { display: block; width: auto; min-height: 0; margin: 0; padding: 0; border: 0; box-shadow: none; }
      .spec-header {
        margin: 0 0 10mm;
        padding: 0 0 6mm;
        background: #ffffff;
        border: 0;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
      .spec-header::after { display: none; }
      .summary-strip { grid-template-columns: repeat(2, 1fr); margin: 0 0 10mm; }
      .spec-toc { position: static; max-height: none; break-after: page; }
      .spec-content h2 { margin-top: 11mm; }
      h2, h3, h4, tr, pre, blockquote, .callout, .summary-item, .compare-card, .process-step, .flow-figure { break-inside: avoid; }
      thead { display: table-header-group; }
      .table-wrap { overflow: visible; }
      table { font-size: 8pt; }
      th, td { padding: 5px 6px; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body data-layout="engineering-review" data-theme="blueprint-slate">
  <a class="skip-link" href="#spec-content">跳到正文</a>
  <main class="spec-shell" data-brand="brawnen">
    <header class="spec-header">
      <p class="document-type">{{DOCUMENT_TYPE}}</p>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUBTITLE}}</p>
      <p class="meta-row"><span>更新时间：{{UPDATED_AT}}</span>{{METADATA}}</p>
    </header>
    <section class="summary-strip" aria-label="工程概览">
      {{SUMMARY_STRIP}}
    </section>
    <nav class="spec-toc" aria-label="文档目录">
      {{TOC}}
    </nav>
    <article class="spec-content" id="spec-content">
      {{CONTENT}}
    </article>
  </main>
</body>
</html>
